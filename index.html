<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Enciclopedia Completa de Pokémon</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>POKÉDEX</h1>
            <p>La Enciclopedia Definitiva de Pokémon</p>
        </div>
    </header>

    <main>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar Pokémon por nombre o número...">
            <button id="searchButton">Buscar</button>
        </div>

        <div class="filter-container">
            <select id="typeFilter">
                <option value="">Todos los Tipos</option>
                <!-- Options will be populated by JavaScript -->
            </select>
        </div>

        <div id="pokemonContainer" class="pokemon-grid">
            <!-- Pokémon cards will be loaded here -->
        </div>

        <div id="loadingSpinner" class="spinner hidden">Cargando...</div>
        
        <div id="pokemonDetailModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="pokemonDetails"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>Creado por LMMG | Datos proporcionados por PokéAPI | Pokémon y Pokémon character names son marcas comerciales de Nintendo.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
